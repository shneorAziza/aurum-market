services:
  mysql:
    image: mysql:8.4
    container_name: aurum_market_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aurum_market
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql_data:
